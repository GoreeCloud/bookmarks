<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Save to GoreeCloud Bookmarks</title><link rel="stylesheet" href="popup.css"><script src="popup.mjs" type="module"></script></head>
<body>
<header><span class="mark" aria-hidden="true">✦</span><span><strong>GoreeCloud</strong><small>BOOKMARKS</small></span></header>
<main>
  <p class="eyebrow">QUICK CAPTURE</p>
  <h1>Keep this page.</h1><p class="description">Save a link to your private local library.</p>
  <form id="save-form">
    <label for="url">Current page</label><input id="url" type="url" readonly aria-readonly="true">
    <label for="title">Title</label><input id="title" maxlength="200" required placeholder="Bookmark title">
    <label for="tags">Tags <span>(comma separated)</span></label><input id="tags" placeholder="research, reading">
    <label for="collection">Collection</label><select id="collection"><option value="">Inbox / no collection</option></select>
    <button id="save" type="submit" class="primary">Save bookmark <span aria-hidden="true">↗</span></button>
  </form>
  <details id="settings"><summary>Connection settings</summary>
    <p class="helper">The operator token creates an eight-hour local session. Only the revocable session token is stored in temporary extension storage, never synced.</p>
    <label for="token">Local server access token</label><input id="token" type="password" autocomplete="off" minlength="24" placeholder="Paste your server access token">
    <button type="button" id="connect">Connect</button>
    <button type="button" id="disconnect">Revoke / forget session</button>
  </details>
  <p id="status" role="status" aria-live="polite"></p>
</main>
</body></html>
