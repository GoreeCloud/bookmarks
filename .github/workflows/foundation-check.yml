name: GoreeCloud Bookmarks foundation boundary
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate source boundary
        run: python3 scripts/check_foundation.py
  web-typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: |
          corepack enable
          yarn install --immutable --mode=skip-build
      - name: Generate Prisma application types
        run: yarn prisma:generate
      - name: Typecheck web application
        run: yarn workspace @linkwarden/web exec tsc --noEmit --pretty false
      - name: Run focused URL safety and search-input/history unit tests
        run: yarn vitest run packages/lib/ssrf.test.ts packages/lib/safeFetch.test.ts apps/web/lib/client/recentSearches.test.ts apps/web/lib/client/searchInput.test.ts
